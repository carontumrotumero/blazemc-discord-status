name: Update Discord status

on:
  schedule:
    # Red de seguridad: si la cadena de auto-disparo se corta por algún
    # motivo, esto eventualmente la reinicia. El cron de GitHub no es
    # confiable para intervalos cortos (puede atrasarse horas), por eso
    # la actualización en tiempo real no depende de esto.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Loop corto (30s) para probar el auto-encadenado sin esperar 6 horas"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-discord-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run status updater
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MC_HOST: ${{ vars.MC_HOST }}
          MC_PORT: ${{ vars.MC_PORT }}
          UPDATE_INTERVAL_SECONDS: "2"
          LOOP_DURATION_SECONDS: ${{ inputs.test_mode && '30' || '20700' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: "update-status.yml"
        run: node scripts/update-status.mjs

      - name: Commit message_id.txt if changed
        run: |
          if [ -n "$(git status --porcelain message_id.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add message_id.txt
            git commit -m "chore: update stored discord message id"
            git push
          fi
